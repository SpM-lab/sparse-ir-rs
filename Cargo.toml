[workspace]
members = [
    "sparse-ir",
    "sparse-ir-capi",
]
resolver = "2"

[workspace.dependencies]
sparse-ir = { version = "0.9.0", path = "sparse-ir" }
faer = "0.24"
faer-traits = "0.24"
tenferro-tensor = "0.7.1"
tenferro-linalg = "0.7.1"
tenferro-cpu = "0.7.1"
tenferro-einsum = { version = "0.7.1", default-features = false, features = ["cpu-faer"] }
num-complex = "0.4"
num-traits = "0.2"
special = "0.2"
statrs = "0.16"
thiserror = "1.0"
once_cell = "1.19"
libc = "0.2"
blas-sys = "0.7"

# Development dependencies (for tests only)
approx = "0.5"
proptest = "1.0"
libm = "0.2"
dashu-float = "0.4"
dashu-base = "0.4"
cargo-husky = "1.5"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpM-lab/sparse-ir-rs"
authors = ["SparseIR Team"]
description = "Rust implementation of SparseIR functionality"

[workspace.lints.rust]
unused_variables = "warn"
unused_imports = "warn"
dead_code = "warn"
non_snake_case = "warn"
unused_mut = "warn"

[profile.dev]
# Do not embed debug info: keeps target/ small (several GB for this
# dependency graph) and edit-test loops fast. Assertions and overflow
# checks stay enabled so bugs still fail loudly.
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.release]
# Maximum optimization for performance
opt-level = 3
# Link-time optimization for better performance
lto = true
# Single codegen unit for better optimization
codegen-units = 1
# No debug info in release artifacts. This matches Cargo's default, but is
# stated explicitly so the intent is reviewable. `strip` keeps its default
# ("debuginfo"), which drops debug sections while preserving the symbols the
# C API (sparse-ir-capi) exports.
debug = false

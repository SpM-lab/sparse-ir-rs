[workspace]
members = [
    "sparse-ir",
    "sparse-ir-core",
    "sparse-ir-dlr",
    "sparse-ir-minipole",
    "sparse-ir-basis",
    "sparse-ir-capi",
]
# The tutorial crate pins its own dependencies and must never move this
# workspace's Cargo.lock, so it is a workspace of its own.
exclude = [
    "docs/tutorial-code",
]
resolver = "2"

[workspace.dependencies]
sparse-ir = { version = "0.13.0", path = "sparse-ir" }
sparse-ir-core = { version = "0.13.0", path = "sparse-ir-core" }
sparse-ir-dlr = { version = "0.13.0", path = "sparse-ir-dlr" }
sparse-ir-minipole = { version = "0.13.0", path = "sparse-ir-minipole" }
sparse-ir-basis = { version = "0.13.0", path = "sparse-ir-basis" }
faer = "0.24"
faer-traits = "0.24"
tenferro-tensor = "0.7.1"
tenferro-linalg = "0.7.1"
tenferro-cpu = "0.7.1"
tenferro-einsum = { version = "0.7.1", default-features = false, features = ["cpu-faer"] }
num-complex = "0.4"
num-traits = "0.2"
thiserror = "1.0"
once_cell = "1.19"
libc = "0.2"
blas-sys = "0.7"

# Development dependencies (for tests only)
approx = "0.5"
proptest = "1.0"
libm = "0.2"
dashu-float = "0.4"
dashu-base = "0.4"
cargo-husky = "1.5"

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SpM-lab/sparse-ir-rs"
authors = ["SparseIR Team"]
description = "Rust implementation of SparseIR functionality"
keywords = ["sparse-ir", "physics", "scientific-computing", "numerics"]
categories = ["science", "mathematics"]

[workspace.lints.rust]
unused_variables = "warn"
unused_imports = "warn"
dead_code = "warn"
non_snake_case = "warn"
unused_mut = "warn"

[profile.release]
# Maximum optimization for performance
opt-level = 3
# Link-time optimization for better performance
lto = true
# Single codegen unit for better optimization
codegen-units = 1

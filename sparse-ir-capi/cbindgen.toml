# cbindgen configuration for sparseir-capi
# This file configures cbindgen to generate C header files from Rust code

language = "C"
# Enable C++ compatibility: adds extern "C" blocks automatically
cpp_compat = true

# Inserted verbatim at the top of the generated header
header = "#pragma once\n"

[export]
# Types to emit even if no exported function uses them (none needed).
# Complex arrays use `Complex64` ({double re; double im;}, defined in
# src/lib.rs), which cbindgen emits because exported functions use it. The
# header defines no `c_complex`: build.rs only runs cbindgen and does not
# post-process its output. C++ code that expects libsparseir's `c_complex`
# can alias it, as cxx_tests does (`using c_complex = Complex64;`).
include = []

# Exclude internal implementation details
exclude = [
    # Internal types that should not be exposed
    "BasisType",
    "FuncsType", 
    "KernelType",
    "SamplingType",
    "SVEResultType",
    "Arc_SVEResult",
    # Internal struct fields
    "inner",
]

[fn]
# Export all functions without additional prefix (functions already have spir_ prefix)
prefix = ""

[enum]
# Export enums that are marked with #[repr(C)]
rename_variants = "ScreamingSnakeCase"

[const]
# Export all public constants
allow_static_const = true




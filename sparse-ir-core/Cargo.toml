[package]
name = "sparse-ir-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core of sparse-ir: statistics, errors, GEMM, fitters, the Basis trait and sparse sampling"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true

[dependencies]
faer.workspace = true
faer-traits.workspace = true
tenferro-tensor.workspace = true
tenferro-linalg.workspace = true
tenferro-cpu.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
# System BLAS (optional, LP64)
blas-sys = { workspace = true, optional = true }
# Lazy static initialization for GEMM dispatcher
once_cell.workspace = true
# Thread pool for the parallel work of the library (see src/parallel.rs),
# with the `parallel` feature
rayon = { workspace = true, optional = true }
# C FFI types (for BLAS function pointers)
libc.workspace = true

[dev-dependencies]
# The doc examples use the whole library (without its default `parallel`
# feature, which would otherwise always be on in the tests of this crate)
sparse-ir = { path = "../sparse-ir", default-features = false }

[build-dependencies]
pkg-config = "0.3"

[features]
default = []
# Use system BLAS (LP64) for the GEMM backend instead of Faer
system-blas = ["blas-sys"]
# Run the threaded work of the library (the SVE, batched Matsubara
# evaluations) on the rayon thread pool; without it everything runs on the
# calling thread. On by default only in the sparse-ir crate.
parallel = ["dep:rayon"]

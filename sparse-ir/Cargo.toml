[package]
name = "sparse-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IR basis, DLR, ESPRIT/MiniPole and sparse sampling for imaginary-time Green's functions"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
exclude = [
    ".cargo_vcs_info.json",
    "Cargo.toml.orig",
]

# Library configuration for shared library
[lib]
name = "sparse_ir"
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true

[dependencies]
sparse-ir-core.workspace = true
sparse-ir-dlr.workspace = true
sparse-ir-minipole.workspace = true
sparse-ir-basis.workspace = true

[dev-dependencies]
num-complex.workspace = true
num-traits.workspace = true
tenferro-tensor.workspace = true
tenferro-linalg.workspace = true
tenferro-cpu.workspace = true
# tenferro-einsum engine for examples/bench_batch.rs
tenferro-einsum.workspace = true
# Git hooks management via cargo-husky
[dev-dependencies.cargo-husky]
version = "1.5"
default-features = false
features = ["user-hooks"]

[features]
default = []
# Shared library features
shared-lib = []
# Use system BLAS (LP64) for GEMM backend by default
system-blas = ["sparse-ir-core/system-blas"]

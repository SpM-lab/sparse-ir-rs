name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-default:
    runs-on: ubuntu-latest
    name: Rust (default backend)

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      # The repository's cargo config also applies to the published wheels,
      # conda packages and C libraries, so it may only ask for instructions
      # that belong to the baseline we support - the fused multiply-add - and
      # never for a CPU model.
      - name: Check the cargo config CPU flags
        run: |
          if grep -rnE '^[^#]*target-cpu' .cargo/; then
            echo "::error::.cargo/ must not set target-cpu"
            exit 1
          fi
          if grep -rnE '^[^#]*target-feature' .cargo/ | grep -v -- '+fma'; then
            echo "::error::.cargo/ must only ask for target-feature=+fma"
            exit 1
          fi

      - name: Build (all targets, default features)
        run: cargo build --all-targets --release --locked

      - name: Run tests (all targets, default features)
        run: cargo test --all-targets --release --locked

      # `--all-targets` does not include doctests, so run them separately.
      - name: Run doctests for sparse-ir (default features)
        run: cargo test --workspace --exclude sparse-ir-capi --doc --release --locked

      # The `parallel` feature is off by default: test the threaded paths
      # of the sve, core and basis crates with it as well.
      - name: Run library tests with the parallel feature
        run: cargo test -p sparse-ir-sve -p sparse-ir-core -p sparse-ir-basis --lib --release --locked --features sparse-ir-sve/parallel,sparse-ir-core/parallel,sparse-ir-basis/parallel

      # spir_cpu_has_fma reads CPUID itself. In a build without FMA, std's
      # runtime detection asks the CPU too, and the test compares the two.
      - name: Test the FMA detection in a build without FMA
        env:
          RUSTFLAGS: -C target-feature=-fma
        run: cargo test -p sparse-ir-capi --lib --locked --target-dir target/no-fma 'cpu::'

  rust-system-blas:
    runs-on: ubuntu-latest
    name: Rust (system BLAS backend)

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Build sparse-ir with system-blas feature
        run: cargo build -p sparse-ir-sve -p sparse-ir-core -p sparse-ir-dlr -p sparse-ir-minipole -p sparse-ir-basis -p sparse-ir --features sparse-ir-core/system-blas --all-targets --release --locked

      - name: Run tests for sparse-ir with system-blas feature
        run: cargo test -p sparse-ir-sve -p sparse-ir-core -p sparse-ir-dlr -p sparse-ir-minipole -p sparse-ir-basis -p sparse-ir --features sparse-ir-core/system-blas --all-targets --release --locked

      - name: Run doctests for sparse-ir with system-blas feature
        run: cargo test -p sparse-ir-sve -p sparse-ir-core -p sparse-ir-dlr -p sparse-ir-minipole -p sparse-ir-basis -p sparse-ir --features sparse-ir-core/system-blas --doc --release --locked

  rust-rollup:
    runs-on: ubuntu-latest
    needs:
      - rust-default
      - rust-system-blas
    if: always()
    steps:
      - name: All Rust jobs passed
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: exit 0

      - name: Some Rust jobs failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

  header-sync:
    runs-on: ubuntu-latest
    name: Check C header sync (assets/sparse_ir_capi.h)

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked

      - name: Regenerate and diff headers
        working-directory: sparse-ir-capi
        run: |
          cbindgen --config cbindgen.toml --cpp-compat --output /tmp/sparseir.h .
          diff include/sparseir/sparseir.h /tmp/sparseir.h
          diff include/sparseir/sparseir.h assets/sparse_ir_capi.h

      # The Fortran and Python declarations are generated from the header
      # too; a C API change must regenerate them in the same change (#294).
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The libclang wheel ships without clang's builtin headers, so `bool`
      # would parse as `int`; give it a stdbool.h.
      - name: Provide stdbool.h to libclang
        run: |
          mkdir -p /tmp/clang-builtins
          echo '#define bool _Bool' > /tmp/clang-builtins/stdbool.h
          echo "C_INCLUDE_PATH=/tmp/clang-builtins" >> "$GITHUB_ENV"

      - name: Regenerate and diff the Fortran C bindings
        working-directory: fortran
        run: |
          uv run script/generate_c_binding.py ../sparse-ir-capi/include/sparseir/sparseir.h
          git diff --exit-code -- src/_cbinding.inc src/_cbinding_public.inc

      - name: Regenerate and diff the Python ctypes bindings
        run: |
          uv run --no-project --with libclang python python/tools/gen_ctypes.py
          git diff --exit-code -- python/pylibsparseir/ctypes_autogen.py

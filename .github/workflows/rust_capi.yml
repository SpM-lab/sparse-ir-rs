name: Rust-CAPI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install OpenBLAS
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev pkg-config
    - name: Initialize and update submodules
      run: |
        # Convert SSH URLs to HTTPS for GitHub Actions
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --jobs 4
        # Initialize libsparseir submodules but skip nested ones that may have issues
        cd libsparseir && git submodule update --init --jobs 4 || true
    - name: Build
      run: cargo build -p sparse-ir-capi --release
    - name: Check that the C library is built without the parallel feature
      # The `parallel` feature of sparse-ir (a rayon thread pool for the SVE,
      # off by default) must stay out of the C library.
      run: |
        for crate in sparse-ir-core sparse-ir-sve; do
          if cargo tree -p sparse-ir-capi -e features -i $crate | grep "$crate feature \"parallel\""; then
            echo "sparse-ir-capi enables the parallel feature of $crate" >&2
            exit 1
          fi
        done
    - name: Run tests
      run: cargo test -p sparse-ir-capi --release

[package]
name = "sparse-ir-basis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The IR basis of sparse-ir: kernels, the singular value expansion and FiniteTempBasis"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true

[dependencies]
sparse-ir-core.workspace = true
sparse-ir-dlr.workspace = true
tenferro-tensor.workspace = true
num-complex.workspace = true
num-traits.workspace = true
# Extended precision
xprec = "0.2.2"
simba = "0.9"
libm.workspace = true
# Extended-precision TSVD / QR
nalgebra = "0.33"

[dev-dependencies]
approx.workspace = true
# High-precision arithmetic (for precision tests)
dashu-float.workspace = true
dashu-base.workspace = true
# The doc examples use the whole library
sparse-ir = { path = "../sparse-ir" }

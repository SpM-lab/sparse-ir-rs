[package]
name = "sparse-ir-basis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The IR basis of sparse-ir: kernels, the singular value expansion and FiniteTempBasis"

[dependencies]
sparse-ir-core.workspace = true
sparse-ir-dlr.workspace = true
tenferro-tensor.workspace = true
num-complex.workspace = true
num-traits.workspace = true
# Extended precision
xprec = "0.2.2"
simba = "0.9"

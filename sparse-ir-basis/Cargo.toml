[package]
name = "sparse-ir-basis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The IR basis of sparse-ir: kernels, the singular value expansion and FiniteTempBasis"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true

[dependencies]
sparse-ir-sve.workspace = true
sparse-ir-core.workspace = true
sparse-ir-dlr.workspace = true
tenferro-tensor.workspace = true
num-complex.workspace = true
num-traits.workspace = true
# Matsubara sampling-point selection (pair_select.rs)
nalgebra = "0.33"

[dev-dependencies]
# Thread pools of a given size, for the thread-count independence tests
# (with the `parallel` feature)
rayon.workspace = true
approx.workspace = true
# High-precision arithmetic (for precision tests)
dashu-float.workspace = true
dashu-base.workspace = true
# The doc examples use the whole library
sparse-ir = { path = "../sparse-ir" }

[features]
# Run the threaded work (the SVE) on the rayon thread pool; see
# sparse-ir-sve/src/parallel.rs
parallel = ["sparse-ir-core/parallel"]
